<svg viewBox="0 0 1100 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="1100" height="480" fill="#0d1117" rx="16"/>
  
  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">AWS End-to-End CI/CD Pipeline Architecture</text>
  <text x="550" y="62" text-anchor="middle" fill="#8b949e" font-size="13">CodePipeline · CodeBuild · ECR · CodeDeploy · ECS Fargate</text>

  <!-- ===== STAGE BOXES ===== -->
  <!-- Stage 1: GitHub -->
  <rect x="30" y="100" width="140" height="240" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="30" y="100" width="140" height="36" rx="12" fill="#21262d"/>
  <rect x="30" y="124" width="140" height="12" fill="#21262d"/>
  <text x="100" y="124" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="bold">SOURCE</text>
  <!-- GitHub icon area -->
  <circle cx="100" cy="195" r="35" fill="#24292e" stroke="#30363d" stroke-width="1.5"/>
  <text x="100" y="200" text-anchor="middle" fill="#f0f6fc" font-size="28">⬡</text>
  <text x="100" y="250" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="bold">GitHub</text>
  <text x="100" y="268" text-anchor="middle" fill="#8b949e" font-size="10">Repository</text>
  <text x="100" y="285" text-anchor="middle" fill="#8b949e" font-size="10">main branch</text>
  <text x="100" y="305" text-anchor="middle" fill="#3fb950" font-size="10">● Webhook trigger</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="220" x2="205" y2="220" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <text x="187" y="213" text-anchor="middle" fill="#8b949e" font-size="9">push</text>

  <!-- Stage 2: CodeBuild -->
  <rect x="205" y="100" width="155" height="240" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="205" y="100" width="155" height="36" rx="12" fill="#21262d"/>
  <rect x="205" y="124" width="155" height="12" fill="#21262d"/>
  <text x="282" y="124" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">BUILD</text>
  <rect x="230" y="148" width="105" height="22" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="282" y="163" text-anchor="middle" fill="#8b949e" font-size="9">AWS CodeBuild</text>
  <text x="282" y="192" text-anchor="middle" fill="#e6edf3" font-size="11">📦 Install deps</text>
  <text x="282" y="210" text-anchor="middle" fill="#e6edf3" font-size="11">🧪 Run tests</text>
  <text x="282" y="228" text-anchor="middle" fill="#e6edf3" font-size="11">🐳 Build image</text>
  <text x="282" y="246" text-anchor="middle" fill="#e6edf3" font-size="11">📤 Push to ECR</text>
  <rect x="220" y="260" width="125" height="20" rx="4" fill="#1a2e1a" stroke="#3fb950" stroke-width="1"/>
  <text x="282" y="274" text-anchor="middle" fill="#3fb950" font-size="9">buildspec.yml</text>
  <text x="282" y="310" text-anchor="middle" fill="#8b949e" font-size="9">imagedefinitions.json</text>

  <!-- Arrow 2 -->
  <line x1="360" y1="220" x2="395" y2="220" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 3: ECR -->
  <rect x="395" y="100" width="140" height="240" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="395" y="100" width="140" height="36" rx="12" fill="#21262d"/>
  <rect x="395" y="124" width="140" height="12" fill="#21262d"/>
  <text x="465" y="124" text-anchor="middle" fill="#bc8cff" font-size="12" font-weight="bold">ARTIFACT</text>
  <rect x="420" y="155" width="90" height="70" rx="8" fill="#1c1428" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="465" y="183" text-anchor="middle" fill="#bc8cff" font-size="22">🐳</text>
  <text x="465" y="202" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="bold">Amazon ECR</text>
  <text x="465" y="248" text-anchor="middle" fill="#e6edf3" font-size="11">myapp-repo</text>
  <text x="465" y="266" text-anchor="middle" fill="#8b949e" font-size="9">:latest</text>
  <text x="465" y="283" text-anchor="middle" fill="#8b949e" font-size="9">:&lt;commit-hash&gt;</text>
  <text x="465" y="310" text-anchor="middle" fill="#8b949e" font-size="9">Docker image store</text>

  <!-- Arrow 3 -->
  <line x1="535" y1="220" x2="570" y2="220" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 4: Manual Approval -->
  <rect x="570" y="100" width="145" height="240" rx="12" fill="#161b22" stroke="#d29922" stroke-width="1.5" stroke-dasharray="6,3"/>
  <rect x="570" y="100" width="145" height="36" rx="12" fill="#272010"/>
  <rect x="570" y="124" width="145" height="12" fill="#272010"/>
  <text x="642" y="124" text-anchor="middle" fill="#d29922" font-size="12" font-weight="bold">APPROVAL</text>
  <text x="642" y="183" text-anchor="middle" fill="#d29922" font-size="28">⏸</text>
  <text x="642" y="212" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="bold">Manual Gate</text>
  <text x="642" y="232" text-anchor="middle" fill="#8b949e" font-size="10">Review before</text>
  <text x="642" y="248" text-anchor="middle" fill="#8b949e" font-size="10">production deploy</text>
  <rect x="590" y="262" width="105" height="20" rx="4" fill="#272010" stroke="#d29922" stroke-width="1"/>
  <text x="642" y="276" text-anchor="middle" fill="#d29922" font-size="9">SNS notification</text>
  <text x="642" y="310" text-anchor="middle" fill="#8b949e" font-size="9">📧 Email alert sent</text>

  <!-- Arrow 4 -->
  <line x1="715" y1="220" x2="750" y2="220" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 5: CodeDeploy + ECS -->
  <rect x="750" y="100" width="165" height="240" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="750" y="100" width="165" height="36" rx="12" fill="#21262d"/>
  <rect x="750" y="124" width="165" height="12" fill="#21262d"/>
  <text x="832" y="124" text-anchor="middle" fill="#f85149" font-size="12" font-weight="bold">DEPLOY</text>
  <rect x="768" y="148" width="130" height="22" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="833" y="163" text-anchor="middle" fill="#8b949e" font-size="9">AWS CodeDeploy → ECS</text>
  <text x="832" y="195" text-anchor="middle" fill="#e6edf3" font-size="11">🔵 Blue (current)</text>
  <text x="832" y="213" text-anchor="middle" fill="#e6edf3" font-size="11">🟢 Green (new)</text>
  <text x="832" y="232" text-anchor="middle" fill="#8b949e" font-size="10">Blue/Green Strategy</text>
  <rect x="768" y="247" width="130" height="20" rx="4" fill="#1a1f2e" stroke="#58a6ff" stroke-width="1"/>
  <text x="833" y="261" text-anchor="middle" fill="#58a6ff" font-size="9">appspec.yml · taskdef.json</text>
  <text x="832" y="290" text-anchor="middle" fill="#3fb950" font-size="10">Zero Downtime ✓</text>
  <text x="832" y="308" text-anchor="middle" fill="#8b949e" font-size="9">Fargate (serverless)</text>

  <!-- Arrow 5 -->
  <line x1="915" y1="220" x2="950" y2="220" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stage 6: ALB + Users -->
  <rect x="950" y="100" width="120" height="240" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="950" y="100" width="120" height="36" rx="12" fill="#21262d"/>
  <rect x="950" y="124" width="120" height="12" fill="#21262d"/>
  <text x="1010" y="124" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="bold">LIVE</text>
  <text x="1010" y="183" text-anchor="middle" fill="#3fb950" font-size="26">🌐</text>
  <text x="1010" y="210" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="bold">App Load</text>
  <text x="1010" y="226" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="bold">Balancer</text>
  <text x="1010" y="252" text-anchor="middle" fill="#8b949e" font-size="10">Port 80/443</text>
  <text x="1010" y="270" text-anchor="middle" fill="#8b949e" font-size="10">→ ECS port 3000</text>
  <text x="1010" y="295" text-anchor="middle" fill="#3fb950" font-size="20">👥</text>
  <text x="1010" y="315" text-anchor="middle" fill="#8b949e" font-size="9">Public users</text>

  <!-- CloudWatch monitoring bar at bottom -->
  <rect x="30" y="365" width="1040" height="80" rx="10" fill="#161b22" stroke="#1f4068" stroke-width="1.5"/>
  <text x="550" y="390" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="bold">📊 Monitoring &amp; Observability</text>
  <text x="200" y="415" text-anchor="middle" fill="#e6edf3" font-size="11">☁️ CloudWatch Alarms</text>
  <text x="200" y="432" text-anchor="middle" fill="#8b949e" font-size="9">ECS CPU/Memory thresholds</text>
  <text x="450" y="415" text-anchor="middle" fill="#e6edf3" font-size="11">📧 SNS Notifications</text>
  <text x="450" y="432" text-anchor="middle" fill="#8b949e" font-size="9">Email on failure / approval</text>
  <text x="700" y="415" text-anchor="middle" fill="#e6edf3" font-size="11">📋 CloudWatch Logs</text>
  <text x="700" y="432" text-anchor="middle" fill="#8b949e" font-size="9">Container + Pipeline logs</text>
  <text x="940" y="415" text-anchor="middle" fill="#e6edf3" font-size="11">🔍 ECS Health Checks</text>
  <text x="940" y="432" text-anchor="middle" fill="#8b949e" font-size="9">/health endpoint</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>
